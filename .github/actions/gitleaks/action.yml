# The gitleaks binary for the secret scans and the rule test (docs/architecture/07-docker-ci-cd.md
# §3 and §4). It runs as a checksum-verified binary, never as a container step (ADR 0009).
name: Install gitleaks
description: Installs the gitleaks release binary after checking its SHA-256, puts it on PATH and exports GITLEAKS_VERSION.

runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        # The release tag with its v, and the SHA-256 of that release's linux_x64 archive. Keep the
        # two lines together: one Renovate custom manager matches both and moves them together.
        GITLEAKS_VERSION: v8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        version="${GITLEAKS_VERSION#v}"
        archive="gitleaks_${version}_linux_x64.tar.gz"
        download="${RUNNER_TEMP}/${archive}"
        bin_dir="${RUNNER_TEMP}/gitleaks"

        curl --fail --silent --show-error --location --retry 3 --output "$download" \
          "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/${archive}"
        # Nothing from the archive is used unless its checksum matches.
        echo "${GITLEAKS_SHA256}  ${download}" | sha256sum --check --strict -
        mkdir -p "$bin_dir"
        tar -xzf "$download" -C "$bin_dir" gitleaks
        rm "$download"

        installed="$("${bin_dir}/gitleaks" version)"
        if [ "$installed" != "$version" ]; then
          echo "::error::gitleaks reports version ${installed} instead of ${version}."
          exit 1
        fi
        echo "Installed gitleaks ${installed}."

        echo "$bin_dir" >> "$GITHUB_PATH"
        # An input of the //#test:root Turbo task: a gitleaks upgrade re-runs the rule test.
        echo "GITLEAKS_VERSION=${GITLEAKS_VERSION}" >> "$GITHUB_ENV"
