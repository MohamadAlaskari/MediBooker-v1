# CodeQL code scanning (docs/architecture/07-docker-ci-cd.md §3, ADR 0009). An advanced workflow:
# GitHub's default setup must stay off, because it would block these uploads.
name: CodeQL

on:
  push:
    branches: [v2-planning, main]
  pull_request:
  schedule:
    # Mondays at 03:23 UTC.
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    # Pull requests from forks get a read-only token: without the upload, the analysis shows
    # nothing.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/generated/**'

      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:javascript-typescript
