# Declared as a required peer without peerDependenciesMeta: this keeps the Prisma CLI out of the
# API's production image (pnpm deploy --prod). The migrate image has it through db-migrate (07 §1).
packageExtensions:
  '@nestjs-cls/transactional-adapter-prisma':
    peerDependenciesMeta:
      prisma:
        optional: true

# Install scripts run only for the packages listed here (pnpm 12 strictDepBuilds, ADR 0006).
allowBuilds:
  lefthook: true
  # 2026-11-06 (X06, through next-intl): denied. Its prebuilt binaries come from optional platform
  # packages; the script only builds from source when none fits. Nothing here uses the watcher.
  '@parcel/watcher': false
  # 2026-11-06 (X02, through swagger-ui-dist): denied. The postinstall only sends install analytics.
  '@scarf/scarf': false
  # 2026-11-04 (F03): denied. The native binary comes from the optional platform package, and
  # SWC emits decorator metadata without the script, which only checks the binding and would
  # otherwise download @swc/wasm. Without an entry, pnpm 12 fails with ERR_PNPM_IGNORED_BUILDS.
  '@swc/core': false
  # 2026-11-05 (F04): allowed. The postinstall downloads the native schema engine that prisma
  # migrate spawns (db-migrate, the drift spec, the seed; 07 §1).
  '@prisma/engines': true
  # 2026-11-05 (F04): denied. The preinstall only compares the Node version with Prisma's list
  # and prints a warning for Node 26; nothing is built or downloaded.
  prisma: false
  # 2026-11-05 (F04, through tsx): denied. The postinstall only validates the binary of the
  # optional @esbuild/<platform> package, which pnpm installs, and downloads one only when it
  # is missing; tsx runs without it.
  esbuild: false
  # 2026-11-05 (F04, through testcontainers and dockerode): denied. The postinstall only warns
  # about the version scheme of packages that depend on protobufjs; it builds nothing.
  protobufjs: false
  # 2026-11-05 (F04, through testcontainers): denied. Both try node-gyp builds of optional
  # native code (ssh2's crypto binding, cpu-features for it); ssh2 falls back to JavaScript,
  # and testcontainers needs it only for a Docker host reached over SSH.
  ssh2: false
  cpu-features: false
