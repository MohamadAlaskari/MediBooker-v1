packages:
  - apps/*
  - packages/*

catalogMode: prefer
savePrefix: ''

# Install only versions published at least one day ago (minutes; pnpm 12's default, written out
# on purpose). "Latest" means the newest version that has passed this gate (ADR 0006).
# minimumReleaseAgeExclude is reserved for urgent security fixes: exact pkg@x.y.z entries,
# each with a dated comment, removed once the version is older than the gate.
minimumReleaseAge: 1440

# Refuse a version that was published with less trust than an earlier one (for example without
# the provenance its predecessors had): a sign of a possible package takeover (ADR 0006).
trustPolicy: no-downgrade
trustPolicyExclude:
  # 2026-11-02 security review: the JavaScript of 2.2.2 is byte-identical to 2.2.1 and its
  # platform binaries have provenance. Remove when lefthook publishes with provenance again.
  - lefthook@2.2.2

catalog:
  '@eslint/js': 10.0.1
  '@nestjs/cli': 12.0.11
  '@nestjs/common': 12.3.2
  '@nestjs/core': 12.3.2
  '@nestjs/platform-express': 12.3.2
  '@nestjs/testing': 12.3.2
  '@nestjs/throttler': 6.7.1
  '@swc/cli': 0.8.2
  '@swc/core': 1.16.21
  '@types/node': 26.6.6
  '@types/supertest': 7.2.1
  '@vitest/coverage-v8': 5.1.0
  '@vitest/eslint-plugin': 1.6.28
  # Watch mode of `nest start --watch` (@swc/cli's optional peer). Not 6.x: @swc/cli 0.8.2 accepts
  # only ^5.0.0 (ADR 0006 version table).
  chokidar: 5.0.0
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-import-x: 4.17.1
  globals: 17.14.0
  helmet: 8.3.0
  lefthook: 2.2.2
  nestjs-cls: 7.0.2
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  prettier: 3.9.10
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  supertest: 7.3.1
  turbo: 2.11.10
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  unplugin-swc: 2.0.0
  vite: 8.3.5
  vitest: 5.1.0
  # The workflow checks of scripts/ci-config.test.ts parse .github with it (F02).
  yaml: 2.9.1
  zod: 4.6.7

# Install scripts run only for the packages listed here (pnpm 12 strictDepBuilds, ADR 0006).
allowBuilds:
  lefthook: true
  # 2026-11-04 (F03): denied. The native binary comes from the optional platform package, and
  # SWC emits decorator metadata without the script, which only checks the binding and would
  # otherwise download @swc/wasm. Without an entry, pnpm 12 fails with ERR_PNPM_IGNORED_BUILDS.
  '@swc/core': false
